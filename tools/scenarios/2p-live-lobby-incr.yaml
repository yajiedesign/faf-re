name: 2p-live-lobby-incr
description: >
  Live-lobby check for the Lua incremental collector: two instances of the
  rebuilt x64 engine on loopback, no adapter, one autolobby match on the stock
  map SCMP_009. Both clients run with the default switch value
  (lua_IncrementalGC=1), so the front-end UI VM, the custom-game lobby VM and
  the in-game session UI VM all run the incremental collector while the lobby
  transitions through lobby -> game. The match runs for three minutes, long
  enough for several incremental cycles to complete and for the session UI to
  cross its threshold.
timeout: 10m

mode: direct
lobby: auto
map: SCMP_009
gameOptions:
  Victory: sandbox   # neither commander dying ends the match inside the wait

game:
  exe: '%ProgramData%\FAForever\bin_x64\main_x64.exe'
  init: init.lua
  nosound: true
  tile: true

players:
  - { uid: 1, name: Alpha }
  - { uid: 2, name: Bravo }

steps:
  - start: all
  - host: 1
  - join: others
  - waitState: { uids: all, state: Launching, timeout: 5m }
  - note: both instances launched; letting the sim run
  - wait: 3m

expect:
  allLaunched: true
  noDesync: true
  noCrash: true
